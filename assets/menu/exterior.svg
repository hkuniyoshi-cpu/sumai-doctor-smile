<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E1EDFF"/>
      <stop offset="1" stop-color="#B7D6FF"/>
    </linearGradient>
    <linearGradient id="wallE" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFCB99"/>
      <stop offset="1" stop-color="#FF9A5A"/>
    </linearGradient>
  </defs>
  <rect width="320" height="200" fill="url(#skyE)"/>
  <!-- sun -->
  <circle cx="270" cy="42" r="20" fill="#FFD84C" opacity=".85"/>
  <!-- cloud -->
  <ellipse cx="70" cy="40" rx="30" ry="10" fill="#fff" opacity=".85"/>
  <ellipse cx="55" cy="46" rx="18" ry="8" fill="#fff" opacity=".85"/>
  <!-- house wall (right half) -->
  <path d="M170 60 L280 60 L280 180 L170 180 Z" fill="#EFEBE4"/>
  <!-- painted wall (partial gradient overlay) -->
  <path d="M170 60 L280 60 L280 130 L170 130 Z" fill="url(#wallE)"/>
  <!-- roof -->
  <path d="M160 60 L225 25 L290 60 Z" fill="#1F52B0"/>
  <path d="M160 60 L225 25 L290 60 Z" fill="#0F2560" opacity=".2"/>
  <!-- windows -->
  <rect x="190" y="75" width="30" height="30" fill="#DBE9FF" stroke="#1F52B0" stroke-width="2" rx="2"/>
  <rect x="235" y="75" width="30" height="30" fill="#DBE9FF" stroke="#1F52B0" stroke-width="2" rx="2"/>
  <line x1="205" y1="75" x2="205" y2="105" stroke="#1F52B0" stroke-width="1"/>
  <line x1="190" y1="90" x2="220" y2="90" stroke="#1F52B0" stroke-width="1"/>
  <line x1="250" y1="75" x2="250" y2="105" stroke="#1F52B0" stroke-width="1"/>
  <line x1="235" y1="90" x2="265" y2="90" stroke="#1F52B0" stroke-width="1"/>
  <!-- door -->
  <rect x="207" y="140" width="36" height="40" fill="#1F52B0" rx="3"/>
  <circle cx="236" cy="160" r="2" fill="#FFD84C"/>
  <!-- ground -->
  <rect x="0" y="180" width="320" height="20" fill="#4CE0C1" opacity=".6"/>
  <!-- ladder + paint roller (foreground worker gear) -->
  <g transform="translate(70 60) rotate(15)">
    <rect x="0" y="0" width="6" height="120" fill="#3A4A66" rx="1"/>
    <rect x="35" y="0" width="6" height="120" fill="#3A4A66" rx="1"/>
    <line x1="6" y1="20" x2="35" y2="20" stroke="#3A4A66" stroke-width="4"/>
    <line x1="6" y1="45" x2="35" y2="45" stroke="#3A4A66" stroke-width="4"/>
    <line x1="6" y1="70" x2="35" y2="70" stroke="#3A4A66" stroke-width="4"/>
    <line x1="6" y1="95" x2="35" y2="95" stroke="#3A4A66" stroke-width="4"/>
  </g>
  <!-- paint bucket -->
  <g transform="translate(20 145)">
    <path d="M0 8 L4 40 L36 40 L40 8 Z" fill="#FF7A0F"/>
    <ellipse cx="20" cy="8" rx="20" ry="5" fill="#FFBD3A"/>
    <path d="M6 4 Q20 -6 34 4" stroke="#3A4A66" stroke-width="2" fill="none"/>
  </g>
  <!-- paint drops -->
  <circle cx="62" cy="130" r="4" fill="#FF7A0F"/>
  <circle cx="130" cy="150" r="3" fill="#FF9A2E"/>
  <circle cx="52" cy="165" r="3" fill="#FFBD3A"/>
</svg>
