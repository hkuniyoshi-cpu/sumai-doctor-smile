<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyRo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DBE9FF"/>
      <stop offset="1" stop-color="#B7D6FF"/>
    </linearGradient>
    <linearGradient id="bld" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3670D0"/>
      <stop offset="1" stop-color="#1F52B0"/>
    </linearGradient>
  </defs>
  <rect width="320" height="200" fill="url(#skyRo)"/>
  <!-- sun -->
  <circle cx="60" cy="45" r="18" fill="#FFD84C" opacity=".8"/>
  <!-- big building on right -->
  <rect x="150" y="10" width="150" height="190" fill="url(#bld)"/>
  <!-- windows grid -->
  <g fill="#DBE9FF" opacity=".85">
    <rect x="165" y="30" width="22" height="26" rx="1"/>
    <rect x="195" y="30" width="22" height="26" rx="1"/>
    <rect x="225" y="30" width="22" height="26" rx="1"/>
    <rect x="255" y="30" width="22" height="26" rx="1"/>
    <rect x="165" y="70" width="22" height="26" rx="1"/>
    <rect x="195" y="70" width="22" height="26" rx="1"/>
    <rect x="225" y="70" width="22" height="26" rx="1"/>
    <rect x="255" y="70" width="22" height="26" rx="1"/>
    <rect x="165" y="110" width="22" height="26" rx="1"/>
    <rect x="195" y="110" width="22" height="26" rx="1"/>
    <rect x="225" y="110" width="22" height="26" rx="1"/>
    <rect x="255" y="110" width="22" height="26" rx="1"/>
    <rect x="165" y="150" width="22" height="26" rx="1"/>
    <rect x="195" y="150" width="22" height="26" rx="1"/>
    <rect x="225" y="150" width="22" height="26" rx="1"/>
    <rect x="255" y="150" width="22" height="26" rx="1"/>
  </g>
  <!-- rope line from top -->
  <line x1="145" y1="10" x2="145" y2="130" stroke="#FF7A0F" stroke-width="3" stroke-dasharray="4 2"/>
  <line x1="145" y1="10" x2="145" y2="130" stroke="#FFBD3A" stroke-width="1"/>
  <!-- worker at bottom of rope -->
  <g transform="translate(145 130)">
    <!-- harness/seat -->
    <rect x="-18" y="0" width="36" height="8" fill="#3A4A66" rx="2"/>
    <line x1="-14" y1="0" x2="-4" y2="-15" stroke="#3A4A66" stroke-width="2"/>
    <line x1="14" y1="0" x2="4" y2="-15" stroke="#3A4A66" stroke-width="2"/>
    <!-- body -->
    <circle cx="0" cy="-25" r="12" fill="#FFCB99"/>
    <!-- helmet -->
    <path d="M-13 -28 A13 13 0 0 1 13 -28 Z" fill="#FF4E70"/>
    <rect x="-14" y="-30" width="28" height="4" fill="#0F2560" opacity=".3"/>
    <!-- eyes -->
    <circle cx="-4" cy="-24" r="1.5" fill="#0F2560"/>
    <circle cx="4" cy="-24" r="1.5" fill="#0F2560"/>
    <!-- vest -->
    <path d="M-12 -10 L12 -10 L14 12 L-14 12 Z" fill="#FF7A0F"/>
    <line x1="0" y1="-10" x2="0" y2="12" stroke="#FFD84C" stroke-width="2"/>
    <!-- roller / paint tool holding right -->
    <g transform="translate(20 5) rotate(15)">
      <rect x="0" y="0" width="4" height="20" fill="#3A4A66"/>
      <rect x="-2" y="-8" width="8" height="10" fill="#22B8FF" rx="1"/>
    </g>
  </g>
  <!-- COST DOWN badge -->
  <g transform="translate(30 130)">
    <circle cx="0" cy="0" r="28" fill="#FF4E70"/>
    <circle cx="0" cy="0" r="28" fill="url(#skyRo)" opacity="0"/>
    <text x="0" y="-4" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff">足場</text>
    <text x="0" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#FFD84C">不要</text>
  </g>
</svg>
