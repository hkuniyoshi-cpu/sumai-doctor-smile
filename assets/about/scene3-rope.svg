<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="s3sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEF6FF"/>
      <stop offset="1" stop-color="#C7DFFF"/>
    </linearGradient>
    <linearGradient id="s3bld" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4CA1F5"/>
      <stop offset="1" stop-color="#1F52B0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="320" fill="url(#s3sky)" rx="16"/>
  <!-- clouds -->
  <ellipse cx="60" cy="60" rx="26" ry="9" fill="#fff" opacity=".85"/>
  <ellipse cx="80" cy="65" rx="18" ry="7" fill="#fff" opacity=".85"/>
  <!-- big building -->
  <rect x="200" y="10" width="180" height="300" fill="url(#s3bld)"/>
  <!-- window grid -->
  <g fill="#EEF6FF" opacity=".9">
    <rect x="215" y="30" width="26" height="30" rx="1"/>
    <rect x="250" y="30" width="26" height="30" rx="1"/>
    <rect x="285" y="30" width="26" height="30" rx="1"/>
    <rect x="320" y="30" width="26" height="30" rx="1"/>
    <rect x="355" y="30" width="20" height="30" rx="1"/>
    <rect x="215" y="80" width="26" height="30" rx="1"/>
    <rect x="250" y="80" width="26" height="30" rx="1"/>
    <rect x="285" y="80" width="26" height="30" rx="1"/>
    <rect x="320" y="80" width="26" height="30" rx="1"/>
    <rect x="355" y="80" width="20" height="30" rx="1"/>
    <rect x="215" y="130" width="26" height="30" rx="1"/>
    <rect x="250" y="130" width="26" height="30" rx="1"/>
    <rect x="285" y="130" width="26" height="30" rx="1"/>
    <rect x="320" y="130" width="26" height="30" rx="1"/>
    <rect x="355" y="130" width="20" height="30" rx="1"/>
    <rect x="215" y="180" width="26" height="30" rx="1"/>
    <rect x="250" y="180" width="26" height="30" rx="1"/>
    <rect x="285" y="180" width="26" height="30" rx="1"/>
    <rect x="320" y="180" width="26" height="30" rx="1"/>
    <rect x="355" y="180" width="20" height="30" rx="1"/>
    <rect x="215" y="230" width="26" height="30" rx="1"/>
    <rect x="250" y="230" width="26" height="30" rx="1"/>
    <rect x="285" y="230" width="26" height="30" rx="1"/>
  </g>
  <!-- rope from building top -->
  <line x1="195" y1="10" x2="195" y2="180" stroke="#FF7A0F" stroke-width="4" stroke-dasharray="5 3"/>
  <!-- worker -->
  <g transform="translate(195 180)">
    <!-- seat -->
    <rect x="-22" y="0" width="44" height="10" fill="#3A4A66" rx="2"/>
    <line x1="-16" y1="0" x2="-4" y2="-18" stroke="#3A4A66" stroke-width="2"/>
    <line x1="16" y1="0" x2="4" y2="-18" stroke="#3A4A66" stroke-width="2"/>
    <!-- body -->
    <circle cx="0" cy="-30" r="14" fill="#FFCB99"/>
    <!-- helmet -->
    <path d="M-15 -32 A15 15 0 0 1 15 -32 Z" fill="#FF4E70"/>
    <rect x="-17" y="-34" width="32" height="5" fill="#0F2560" opacity=".3"/>
    <!-- face -->
    <circle cx="-4" cy="-28" r="1.5" fill="#0F2560"/>
    <circle cx="4" cy="-28" r="1.5" fill="#0F2560"/>
    <path d="M-3 -22 Q0 -20 3 -22" fill="none" stroke="#0F2560" stroke-width="1" stroke-linecap="round"/>
    <!-- vest -->
    <path d="M-14 -14 L14 -14 L16 14 L-16 14 Z" fill="#FF7A0F" stroke="#0F2560" stroke-width="1"/>
    <line x1="0" y1="-14" x2="0" y2="14" stroke="#FFD84C" stroke-width="2"/>
    <!-- tools belt -->
    <rect x="-16" y="14" width="32" height="3" fill="#0F2560"/>
  </g>
  <!-- COST DOWN badge -->
  <g transform="translate(80 200)">
    <circle cx="0" cy="0" r="36" fill="#FF4E70" stroke="#fff" stroke-width="3"/>
    <text x="0" y="-6" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fff">足場</text>
    <text x="0" y="11" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFD84C">不要</text>
    <text x="0" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#fff">工期も短縮</text>
  </g>
  <!-- Yen down arrow -->
  <g transform="translate(80 100)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#FF7A0F">¥</text>
    <path d="M -12 8 L 0 20 L 12 8" fill="none" stroke="#FF4E70" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 0 15 L 0 5" stroke="#FF4E70" stroke-width="2"/>
  </g>
  <!-- ground -->
  <rect x="0" y="290" width="200" height="30" fill="#4CE0C1" opacity=".5"/>
</svg>
